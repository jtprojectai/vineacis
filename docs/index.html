<style>
:root{
  --bg:#F6F1EA; --panel:#FFFFFF; --panel-2:#F4EBE2; --line:#E3D5C9;
  --text:#241917; --text-dim:#6E574F; --text-dimmer:#9C8880;
  --cbio:#C43F63; --csio:#B85F35;
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  --font-mono:'IBM Plex Mono',"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#130D0E; --panel:#1F1517; --panel-2:#28181B; --line:#3D2A2D;
    --text:#F3EAE8; --text-dim:#B79FA0; --text-dimmer:#7C6668;
    --cbio:#EC6D80; --csio:#F0A87E;
  }
}
html{background:var(--bg);}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--font-sans); -webkit-font-smoothing:antialiased;
  min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center;
  padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.shell{width:100%; max-width:560px;}
.brand{display:flex; align-items:center; gap:14px; margin-bottom:6px;}
.brand img{width:44px; height:44px; flex-shrink:0;}
.brand-text{min-width:0;}
.brand-text .name{font-size:24px; font-weight:700; letter-spacing:.2px;}
.brand-text .eyebrow{
  font-family:var(--font-mono); font-size:11.5px; letter-spacing:.7px;
  color:var(--text-dimmer); text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.lede{font-size:15px; line-height:1.65; color:var(--text-dim); margin:14px 0 26px;}
.cards{display:flex; flex-direction:column; gap:14px;}
a.card{
  display:block; text-decoration:none; color:inherit;
  background:var(--panel); border:1px solid var(--line); border-left:4px solid var(--tone);
  border-radius:12px; padding:18px 18px 16px;
  transition:transform .15s ease, box-shadow .15s ease;
}
a.card:hover, a.card:focus-visible{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.10); outline:none;}
a.card.cbio{--tone:var(--cbio);}
a.card.csio{--tone:var(--csio);}
.card .tag{
  font-family:var(--font-mono); font-size:11.5px; letter-spacing:.7px;
  color:var(--tone); text-transform:uppercase;
}
.card h2{margin:6px 0 6px; font-size:19px; font-weight:700; letter-spacing:.2px;}
.card p{margin:0; font-size:14.5px; line-height:1.6; color:var(--text-dim);}
.card .go{
  margin-top:12px; font-family:var(--font-mono); font-size:12.5px; color:var(--tone);
}
footer{
  margin-top:26px; font-family:var(--font-mono); font-size:12px;
  color:var(--text-dimmer); line-height:1.7;
}
</style>
